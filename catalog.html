<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalog — Alpha Woollens (U) Ltd</title>
<meta name="description" content="Browse Alpha Woollens' full catalog of security uniforms, school uniforms, protective workwear and corporate apparel." />
<link rel="icon" href="assets/images/brand/logo.png" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/home.css" />
<link rel="stylesheet" href="css/catalog.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="selvedge" aria-hidden="true"></div>

<header class="site-header" id="site-header"></header>

<main id="main-content">

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow" style="color:#e98276">Product Catalog</span>
      <h1 class="display-lg" style="color:white">Every Article We Manufacture</h1>
      <div class="breadcrumb">
        <a href="index.html">Home</a> <span>/</span> <span>Catalog</span>
      </div>
    </div>
  </section>

  <section class="section-pad-sm bg-white catalog-toolbar-section">
    <div class="container">
      <div class="catalog-toolbar">
        <div class="search-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="search" id="catalog-search" placeholder="Search products — e.g. 'raincoat', 'overalls', 'cap'" aria-label="Search catalog" />
        </div>
        <div class="cat-pills" id="category-pills" role="group" aria-label="Filter by category"></div>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>
  </section>

  <section class="section-pad-sm bg-stone">
    <div class="container">
      <div class="grid grid-4" id="catalog-grid"></div>
      <div id="empty-state" class="empty-state" hidden>
        <h3>No products match your search</h3>
        <p>Try a different keyword or clear the category filter.</p>
        <button class="btn btn-outline-navy mt-16" id="clear-filters">Clear Filters</button>
      </div>
    </div>
  </section>

  <section class="section-pad-sm cta-band">
    <div class="container cta-inner">
      <div>
        <h2 class="display-md">Don't see exactly what you need?</h2>
        <p class="body-text mt-8">We manufacture custom variants and new articles on request — just ask.</p>
      </div>
      <a href="contact.html" class="btn btn-primary">Request Custom Order</a>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<!-- ============ PRODUCT DETAIL MODAL ============ -->
<div class="modal-overlay" id="product-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="Close product details">&times;</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="js/site-config.js"></script>
<script src="js/products-data.js"></script>
<script src="js/site.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
